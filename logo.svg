<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="440" viewBox="0 0 1280 440">
  <!-- True North Keys — Logo concept 1: North Star Key -->
  <!-- Emblem: red badge, white key pointing up (north), bow holds a north star -->
  <circle cx="220" cy="220" r="196" fill="#D80621"/>
  <circle cx="220" cy="220" r="196" fill="none" stroke="#B0051B" stroke-width="4"/>
  <circle cx="220" cy="220" r="168" fill="none" stroke="#FFFFFF" stroke-width="5"/>

  <!-- Key bow (head) -->
  <circle cx="220" cy="150" r="72" fill="#FFFFFF"/>
  <circle cx="220" cy="150" r="46" fill="#D80621"/>
  <!-- North star (4-point) inside the bow -->
  <path d="M220 116 L228 142 L254 150 L228 158 L220 184 L212 158 L186 150 L212 142 Z" fill="#FFFFFF"/>

  <!-- Key shaft -->
  <rect x="202" y="212" width="36" height="118" rx="10" fill="#FFFFFF"/>
  <!-- Key teeth -->
  <rect x="238" y="272" width="58" height="30" rx="8" fill="#FFFFFF"/>
  <rect x="238" y="316" width="42" height="30" rx="8" fill="#FFFFFF"/>

  <!-- Wordmark -->
  <text x="480" y="208" font-family="Arial, Helvetica, sans-serif" font-size="92" font-weight="bold" fill="#1A1A1A" letter-spacing="1">TRUE NORTH</text>
  <text x="484" y="308" font-family="Arial, Helvetica, sans-serif" font-size="92" font-weight="bold" fill="#D80621" letter-spacing="26">KEYS</text>
  <text x="488" y="368" font-family="Arial, Helvetica, sans-serif" font-size="30" fill="#555555" letter-spacing="6">DESIGNATED DRIVER SERVICE</text>
</svg>
